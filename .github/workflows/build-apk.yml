
name: Build ZOMA XIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: unzip -o ZOMA_XIT_START_HERE.zip -d src

      - name: Set Android Java and Kotlin targets to 17
        run: |
          cat >> src/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          EOF

      - name: Verify target settings
        working-directory: src
        run: |
          grep -n -A 5 -B 2 "compileOptions" app/build.gradle.kts

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZOMA-XIT-debug-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
