
name: Build ZOMA XIT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: unzip -o ZOMA_XIT_START_HERE.zip -d src

      - name: Fix Java and Kotlin compatibility
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' src/app/build.gradle.kts
          cat >> src/app/build.gradle.kts <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          EOF

      - name: Build APK
        working-directory: src
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZOMA-XIT-debug-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
